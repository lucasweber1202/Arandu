version: 2
updates:
  # Dependências entram por pilot (feature/* -> pilot -> main): uma PR direto em
  # main cria divergência main x pilot (ocorreu com a #126). O Dependabot lê esta
  # configuração da branch padrão, então vale depois da promoção pilot -> main.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "pilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "pilot"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
