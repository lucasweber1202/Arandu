name: Merge audit

# Detecção pós-merge, não prevenção: a prevenção é a ruleset de
# .github/rulesets/ (ver docs/BRANCH_PROTECTION.md). Um job curto, só leitura,
# que falha se o commit que entrou em pilot/main não veio de PR com os quatro
# gates verdes no HEAD mergeado e com a base contida nesse HEAD.
on:
  push:
    branches: [pilot, main]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  merge-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Audit merged PR gates and base freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-merge.mjs "${{ github.sha }}" "${{ github.repository }}"
