name: Arandu browser validation group
on:
  workflow_call:
    inputs:
      browser_group:
        type: string
        required: true
    outputs:
      receipt:
        value: ${{ jobs.browser.outputs.receipt }}
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    env:
      ARANDU_SITE_URL: https://arandu.example.com
      ARANDU_BROWSER_GROUP: ${{ inputs.browser_group }}
      ARANDU_BROWSER_PROFILE_DIR: reports/ci-performance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --include=optional
      - name: Validate browser group before preparation
        run: node --input-type=module -e "import {browserProjects} from './scripts/ci-browser-groups.mjs'; browserProjects(process.env.ARANDU_BROWSER_GROUP)"
      - name: Build identical regular product from candidate checkout
        run: npm run build
      - name: Build size budget
        run: npm run check:build-size
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Cache de binários por ABI do runner, arquitetura, Playwright e lockfile.
      # Dependências apt e verificação dos três motores rodam em todo job.
      # Salvar antes dos testes preserva o cache mesmo se a suíte for cancelada.
      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-

      - name: Prepare signed Ubuntu archive and bounded apt network retries
        run: sudo "$(command -v node)" scripts/configure-ci-apt.mjs

      - name: Install browser system dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium firefox webkit

      - name: Verify and install Chromium, Firefox and WebKit
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: npx playwright install chromium firefox webkit

      - name: Verify browser launch and page rendering
        timeout-minutes: 2
        run: node scripts/verify-ci-browsers.mjs

      # Cache persistence is best-effort; installation and tests remain gates.
      - name: Save verified Playwright browsers before tests
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # Cobre jornadas públicas, do comprador, autenticação, seleção, contraste
      # e mobile nos três motores. A suíte de apresentação roda separada porque
      # exige um build com ARANDU_PRESENTATION_MODE=true.
      - name: Desktop and mobile journeys across browser engines
        run: node scripts/run-ci-browser-group.mjs

      # The repository's Actions artifact quota may be exhausted. These six
      # public/unauthenticated PNGs remain recoverable from the job log.
      - name: Selected visual evidence in logs
        if: always()
        run: |
          for path in reports/financial-visual/{chromium-desktop,mobile-chrome}/{home,dashboard,provider}.png; do
            if [ -f "$path" ]; then
              printf 'ARANDU_IMAGE_BEGIN %s\n' "$path"
              base64 -w0 "$path"
              printf '\nARANDU_IMAGE_END\n'
            fi
          done

      - name: Financial visual evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arandu-financial-visual-${{ github.sha }}-${{ inputs.browser_group }}
          path: reports/financial-visual
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arandu-playwright-evidence-${{ inputs.browser_group }}
          path: |
            reports/playwright
            reports/playwright-presentation
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Required coverage and timing receipt
        id: receipt
        if: always()
        env:
          RECEIPT_FILE: reports/ci-performance/browser-${{ inputs.browser_group }}.json
        run: node scripts/ci-browser-receipt.mjs "$RECEIPT_FILE"

