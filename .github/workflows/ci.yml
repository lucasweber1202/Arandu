name: Arandu CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: arandu-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      risk: ${{ steps.policy.outputs.risk }}
      deep: ${{ steps.policy.outputs.deep }}
      sha: ${{ steps.policy.outputs.sha }}
      suites: ${{ steps.policy.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - id: policy
        run: node scripts/ci/classify-event.mjs
  full:
    needs: classify
    if: needs.classify.outputs.deep == 'true'
    uses: ./.github/workflows/ci-full.yml
  integration:
    needs: classify
    if: needs.classify.outputs.deep == 'true'
    uses: ./.github/workflows/demo-integration.yml
  fast:
    needs: classify
    if: needs.classify.outputs.deep == 'false'
    runs-on: ubuntu-24.04
    env:
      ARANDU_SITE_URL: https://arandu.example.com
      CI_SUITES: ${{ needs.classify.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run audit:ci
      - run: npm run check:all
      - run: npm run build
      - run: npm run check:build-size
      - run: npm run check:dist-assets && npm run check:seo:dist
      - run: npm run check:financial-surface && npm run check:financial-navigation
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci/targeted-browser.mjs
      - run: npm run pretest:e2e:presentation
      - run: npx playwright test --config playwright.presentation.config.js tests/e2e/public-tour.spec.js --project=chromium-desktop --project=mobile-chrome
  database:
    needs: [classify, fast, full, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Verify required validation and explicit applicability
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RISK: ${{ needs.classify.outputs.risk }}
          DEEP: ${{ needs.classify.outputs.deep }}
          ANALYZED_SHA: ${{ needs.classify.outputs.sha }}
          FAST_RESULT: ${{ needs.fast.result }}
          DEMO_RESULT: ${{ needs.integration.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: node scripts/ci/check-result.mjs
  deploy-boundaries:
    needs: [classify, fast, full, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Verify required validation and explicit applicability
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RISK: ${{ needs.classify.outputs.risk }}
          DEEP: ${{ needs.classify.outputs.deep }}
          ANALYZED_SHA: ${{ needs.classify.outputs.sha }}
          FAST_RESULT: ${{ needs.fast.result }}
          DEMO_RESULT: ${{ needs.integration.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: node scripts/ci/check-result.mjs
  validate:
    needs: [classify, fast, full, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Verify required validation and explicit applicability
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RISK: ${{ needs.classify.outputs.risk }}
          DEEP: ${{ needs.classify.outputs.deep }}
          ANALYZED_SHA: ${{ needs.classify.outputs.sha }}
          FAST_RESULT: ${{ needs.fast.result }}
          DEMO_RESULT: ${{ needs.integration.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: node scripts/ci/check-result.mjs
  presentation:
    needs: [classify, fast, full, integration]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Verify required validation and explicit applicability
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RISK: ${{ needs.classify.outputs.risk }}
          DEEP: ${{ needs.classify.outputs.deep }}
          ANALYZED_SHA: ${{ needs.classify.outputs.sha }}
          FAST_RESULT: ${{ needs.fast.result }}
          DEMO_RESULT: ${{ needs.integration.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: node scripts/ci/check-result.mjs
