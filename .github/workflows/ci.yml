name: Arandu CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: arandu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Clean install, upgrade, rollback, RLS and transaction tests
        env:
          ARANDU_DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:database

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Audit high-severity dependency vulnerabilities
        run: npm run audit:ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom:ci

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arandu-sbom-${{ github.sha }}
          path: reports/arandu-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Full source, contract and governance checks
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Build size budget
        run: npm run check:build-size

      # Precisa rodar aqui, e não só dentro de `predeploy`: aquele job afirma
      # saída diferente de zero, então uma referência quebrada no build passaria
      # despercebida por ser mais uma falha entre as esperadas.
      - name: Published asset integrity
        run: npm run check:dist-assets

      - name: SEO in built output
        run: npm run check:seo:dist

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      # Cobre jornadas públicas, do comprador, autenticação, seleção, contraste
      # e mobile nos três motores. A suíte de apresentação roda separada porque
      # exige um build com ARANDU_PRESENTATION_MODE=true.
      - name: Desktop and mobile journeys across browser engines
        run: npm run test:e2e

      - name: Safe presentation journeys across browser engines
        run: npm run test:e2e:presentation

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arandu-playwright-evidence
          path: |
            reports/playwright
            reports/playwright-presentation
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Simulate Vercel preview technical deploy
        env:
          VERCEL_ENV: preview
        run: npm run vercel-build

      - name: Simulate Vercel production technical deploy
        env:
          VERCEL_ENV: production
        run: npm run vercel-build

      - name: Confirm final go-live remains fail-closed
        run: |
          set +e
          npm run predeploy > /tmp/arandu-predeploy.log 2>&1
          status=$?
          set -e
          cat /tmp/arandu-predeploy.log
          test "$status" -ne 0
          grep -q "Arandu Release Status" /tmp/arandu-predeploy.log
          grep -q "BLOQUEADO" /tmp/arandu-predeploy.log
