name: Arandu CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: arandu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Clean install, upgrade, rollback, RLS and transaction tests
        env:
          ARANDU_DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:database

  validate:
    runs-on: ubuntu-latest
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Full source and contract checks
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: SEO in built output
        run: npm run check:seo:dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile journeys
        run: npm run test:e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arandu-playwright-evidence
          path: |
            reports/playwright
            test-results
          if-no-files-found: ignore
          retention-days: 7
