name: Arandu CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: arandu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Clean install, upgrade, rollback, RLS and transaction tests
        env:
          ARANDU_DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:database

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Audit high-severity dependency vulnerabilities
        run: npm run audit:ci

      - name: Full source, contract and governance checks
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Build size budget
        run: npm run check:build-size

      - name: SEO in built output
        run: npm run check:seo:dist

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Public journeys in Chromium, Firefox and WebKit
        run: npm run test:e2e

      - name: Safe presentation journeys in Chromium, Firefox and WebKit
        run: npm run test:e2e:presentation

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arandu-playwright-evidence
          path: |
            reports/playwright
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Simulate Vercel preview technical deploy
        env:
          VERCEL_ENV: preview
        run: npm run vercel-build

      - name: Simulate Vercel production technical deploy
        env:
          VERCEL_ENV: production
        run: npm run vercel-build

      - name: Confirm final go-live remains fail-closed
        run: |
          set +e
          npm run predeploy > /tmp/arandu-predeploy.log 2>&1
          status=$?
          set -e
          cat /tmp/arandu-predeploy.log
          test "$status" -ne 0
          grep -q "Arandu Release Status" /tmp/arandu-predeploy.log
          grep -q "BLOQUEADO" /tmp/arandu-predeploy.log
