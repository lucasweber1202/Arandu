name: Arandu Demo Integration (ephemeral)
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  passport-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI_DEMO_REPORTS: ${{ github.workspace }}/reports/passport-diagnostic
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Identify source and require runner capacity
        run: |
          git rev-parse HEAD
          node scripts/ci-demo/resources.mjs
          psql --version
      - name: Block hosted Supabase
        run: |
          node --input-type=module -e "import {ACTIVE_SUPABASE_ASSIGNMENTS as a} from './lib/deployment-topology.mjs'; for(const ref of new Set(Object.values(a).flat().filter(Boolean))) console.log('0.0.0.0 '+ref+'.supabase.co'); for(const host of ['supabase.com','api.supabase.com','api.supabase.io']) console.log('0.0.0.0 '+host);" | sudo tee -a /etc/hosts > /dev/null
      - name: Install pinned dependencies and build
        run: npm ci --include=optional && npm run build
      - name: Verify the exact Passport selector before preparing infrastructure
        run: npx playwright test --config playwright.demo.config.js tests/e2e/demo-baseline.spec.js --project demo-desktop --grep 'Financial Passport:' --list
      - name: Pull pinned Supabase images
        run: bash scripts/ci-demo/run.sh images
      - name: Start canonical local stack
        run: bash scripts/ci-demo/run.sh up
      - name: Canonical smoke and seed
        run: |
          bash scripts/ci-demo/run.sh smoke
          bash scripts/ci-demo/run.sh seed 2>&1 | grep -v '@' | tee reports/passport-diagnostic/seed.txt
          bash scripts/ci-demo/run.sh check 2>&1 | grep -v '@' | tee reports/passport-diagnostic/check.txt
      - name: Chromium only
        run: |
          sudo "$(command -v node)" scripts/configure-ci-apt.mjs
          npx playwright install --with-deps chromium
      - name: Compare candidate and main Passport with real sessions
        env:
          PASSPORT_NETWORK_DIAGNOSTICS: '1'
        run: bash scripts/ci-demo/passport-diagnostic.sh
      - name: Teardown
        if: always()
        run: bash scripts/ci-demo/run.sh down
      - name: Retain sanitized reports without traces or session state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: passport-diagnostic-${{ github.run_id }}
          path: reports/passport-diagnostic
          if-no-files-found: error
          retention-days: 7
