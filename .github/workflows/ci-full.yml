name: Arandu full validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # A imagem ubuntu-latest costuma trazer o psql; instala só se faltar.
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Clean install, upgrade, rollback, RLS and transaction tests
        env:
          ARANDU_DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:database

      - name: Prepare signed Ubuntu archive for recovery tools
        run: sudo "$(command -v node)" scripts/configure-ci-apt.mjs

      - name: Install pinned PostgreSQL 17 and age
        run: bash scripts/install-recovery-tools.sh

      - name: Real synthetic encrypted export and same-backup restore
        run: node scripts/test-recovery-real.mjs

  # Cheap source + both build budgets gate browser setup. All four disjoint groups
  # preserve all five projects; explicit coverage receipts fail closed per SHA.
  # Full deploy boundaries remain mandatory in parallel, before final contexts.
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.plan.outputs.receipt }}
    env:
      ARANDU_BROWSER_PROFILE_DIR: reports/ci-performance
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Audit high-severity dependency vulnerabilities
        run: npm run audit:ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom:ci

      # A geração é o gate; retenção é best-effort porque a quota de artifacts
      # é externa e não deve impedir os checks seguintes de executarem.
      - name: Upload SBOM
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arandu-sbom-${{ github.sha }}
          path: reports/arandu-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Full source, contract and governance checks
        run: npm run check:all

      - name: Build
        run: npm run build

      - name: Build size budget
        run: npm run check:build-size

      # Precisa rodar aqui, e não só dentro de `predeploy`: aquele job afirma
      # saída diferente de zero, então uma referência quebrada no build passaria
      # despercebida por ser mais uma falha entre as esperadas.
      - name: Published asset integrity
        run: npm run check:dist-assets

      - name: SEO in built output
        run: npm run check:seo:dist

      # Mesma razão do gate acima: só o artefato publicado revela navegação
      # escondida por CSS, link público para tela administrativa, referência a
      # arquivo não publicado e audiência sem porta de entrada.
      - name: Published financial surface and navigation
        run: npm run check:financial-surface && npm run check:financial-navigation

      - name: List every product case and required browser project
        env:
          ARANDU_BROWSER_PLAN_ONLY: '1'
        run: npm run test:e2e:list -- --reporter=./scripts/ci-browser-reporter.mjs
      - name: Required expected coverage plan
        id: plan
        run: node scripts/ci-browser-receipt.mjs reports/ci-performance/browser-plan.json
      - name: Cheap explicit Demo build and unchanged budgets before browsers
        env:
          VERCEL_ENV: preview
          ARANDU_DEMO_MODE: 'true'
        run: npm run build && npm run check:build-size

  validate:
    needs: validate-source
    uses: ./.github/workflows/ci-browser.yml
    with:
      browser_group: firefox

  validate-mobile:
    needs: validate-source
    uses: ./.github/workflows/ci-browser.yml
    with:
      browser_group: chromium

  validate-webkit:
    needs: validate-source
    uses: ./.github/workflows/ci-browser.yml
    with:
      browser_group: webkit

  validate-safari:
    needs: validate-source
    uses: ./.github/workflows/ci-browser.yml
    with:
      browser_group: safari

  browser-coverage:
    needs: [validate-source, validate, validate-mobile, validate-webkit, validate-safari]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BROWSER_PLAN: ${{ needs.validate-source.outputs.plan }}
      BROWSER_FIREFOX: ${{ needs.validate.outputs.receipt }}
      BROWSER_CHROMIUM: ${{ needs.validate-mobile.outputs.receipt }}
      BROWSER_WEBKIT: ${{ needs.validate-webkit.outputs.receipt }}
      BROWSER_SAFARI: ${{ needs.validate-safari.outputs.receipt }}
    steps:
      - name: Checkout coverage verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check exact SHA and complete union of all four browser groups
        run: node scripts/ci-browser-coverage.mjs --job-outputs

  presentation:
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ARANDU_SITE_URL: https://arandu.example.com
      ARANDU_PRESENTATION_MODE: "true"
      VERCEL_ENV: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --include=optional
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Cache de binários por ABI do runner, arquitetura, Playwright e lockfile.
      # Dependências apt e verificação dos três motores rodam em todo job.
      # Salvar antes dos testes preserva o cache mesmo se a suíte for cancelada.
      - name: Restore Playwright browsers
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-ubuntu-24.04-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-

      - name: Prepare signed Ubuntu archive and bounded apt network retries
        run: sudo "$(command -v node)" scripts/configure-ci-apt.mjs

      - name: Install browser system dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium firefox webkit

      - name: Verify and install Chromium, Firefox and WebKit
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: npx playwright install chromium firefox webkit

      - name: Verify browser launch and page rendering
        timeout-minutes: 2
        run: node scripts/verify-ci-browsers.mjs

      # Cache persistence is best-effort; installation and tests remain gates.
      - name: Save verified Playwright browsers before tests
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      # Supplemental smoke publishes the geometry of the known regressions
      # promptly. Its failure never replaces or prevents the complete matrix.
      - name: Build presentation for Safari layout smoke
        run: npm run pretest:e2e:presentation
      - name: Safari layout smoke
        continue-on-error: true
        run: |
          mkdir -p reports/safari-layout
          npx playwright test --config playwright.presentation.config.js --project mobile-safari --grep 'comparação no celular|larguras estreitas' --reporter=list 2>&1 | tee reports/safari-layout/result.log
      - name: Retain early Safari layout evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arandu-safari-layout-${{ github.sha }}
          path: |
            reports/safari-layout
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Presentation journeys
        timeout-minutes: 25
        run: npm run test:e2e:presentation
      - name: Upload presentation browser evidence on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arandu-presentation-evidence-${{ github.sha }}
          path: |
            reports/playwright-presentation
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ARANDU_SITE_URL: https://arandu.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --include=optional

      # This check is intentionally informational while Stage 0 is blocked:
      # the branch's four real gates continue running without secrets or Vercel logs.
      # It is NOT a release approval or an override of finance:env:check.
      - name: Stage 0 static database assignment diagnosis
        run: node scripts/stage0-static-preflight.mjs --github-summary

      - name: Financial preview excludes implicit demo code
        env:
          VERCEL_ENV: preview
        run: npm run vercel-build

      - name: Financial preview has no demo pages or engine
        run: node scripts/test-demo-mode.mjs --dist

      - name: Simulate explicit demonstration preview technical deploy
        env:
          VERCEL_ENV: preview
          ARANDU_DEMO_MODE: 'true'
        run: npm run vercel-build

      - name: Preview publishes the labelled demo sandbox
        run: node scripts/test-demo-mode.mjs --dist --expect-demo

      # Desde a #82 um deploy de produção da Vercel sem ambiente declarado
      # (ARANDU_ENV demo|pilot|production ou ARANDU_DEPLOYMENT_KIND=demo) é
      # recusado; os ambientes reais exigem credenciais que o CI não tem.
      - name: Vercel production deploy without a declared environment fails closed
        env:
          VERCEL_ENV: production
        run: |
          set +e
          npm run vercel-build > /tmp/arandu-vercel-prod.log 2>&1
          status=$?
          set -e
          tail -3 /tmp/arandu-vercel-prod.log
          test "$status" -ne 0
          grep -q "Deploy de produção sem ARANDU_ENV" /tmp/arandu-vercel-prod.log

      - name: Build the production bundle
        env:
          VERCEL_ENV: production
        run: npm run build

      - name: Production bundle contains no demo page or engine
        run: node scripts/test-demo-mode.mjs --dist

      - name: Demo mode cannot be forced into financial production
        env:
          VERCEL_ENV: production
          ARANDU_DEMO_MODE: 'true'
        run: |
          set +e
          npm run build > /tmp/arandu-demo-prod.log 2>&1
          status=$?
          set -e
          cat /tmp/arandu-demo-prod.log | tail -5
          test "$status" -ne 0
          grep -q "não pode ser ativado na produção financeira" /tmp/arandu-demo-prod.log

      - name: Standalone demo build without real credentials
        run: npm run build:demo

      - name: Confirm final go-live remains fail-closed
        run: |
          set +e
          npm run predeploy > /tmp/arandu-predeploy.log 2>&1
          status=$?
          set -e
          cat /tmp/arandu-predeploy.log
          test "$status" -ne 0
          grep -q "Arandu Release Status" /tmp/arandu-predeploy.log
          grep -q "BLOQUEADO" /tmp/arandu-predeploy.log
