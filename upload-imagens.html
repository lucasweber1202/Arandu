<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="Upload de imagens para obras e artistas da Arandu via Supabase Storage."/><title>Upload de imagens — Arandu</title><link rel="stylesheet" href="css/arandu-system.css?v=20260608"/><link rel="stylesheet" href="css/arandu-admin-suite.css?v=20260709-admin-suite-1"/>
</head><body class="admin-suite-page"><a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a><header class="site-header"><div class="container header-inner"><a class="brand-logo" href="index.html">Arandu</a><nav class="site-nav"><a href="painel-admin.html">Painel</a><a href="obra-editor.html">Obra</a><a href="artista-editor.html">Artista</a><a href="diagnostico-catalogo.html">Diagnóstico</a></nav></div></header><main id="conteudo-principal" class="admin-shell"><div class="container"><div class="breadcrumb"><a href="painel-admin.html">Painel</a><span>›</span><span>Upload</span></div><div class="admin-topbar"><div><p class="eyebrow">Mídia</p><h1>Upload de imagens.</h1><p>Envie fotos para o Supabase Storage e aplique automaticamente à obra ou ao artista.</p></div><div class="admin-token-card"><label>Sessão administrativa<input id="upload-imagens-sessao-administrativa-protegida-1" name="sessao-administrativa-protegida" data-admin-session-hint type="password" placeholder="sessão administrativa protegida"/></label></div></div><section class="admin-grid"><aside class="admin-sidebar"><a href="obra-editor.html">Editar obra</a><a href="artista-editor.html">Editar artista</a><a href="catalogo-intake.html">Importar CSV</a></aside><article class="admin-editor"><form data-upload-form><div class="admin-form-grid"><label>Tipo de entidade<select id="upload-imagens-entity-type-2" name="entity_type"><option value="artwork">Obra</option><option value="artist">Artista</option><option value="certificate">Certificado</option></select></label><label>ID da entidade<input id="upload-imagens-entity-id-3" name="entity_id" placeholder="id da obra/artista" required/></label><label>Campo de imagem<select id="upload-imagens-target-field-4" name="target_field"><option value="main_image_url">Imagem principal da obra</option><option value="detail_image_url">Detalhe da obra</option><option value="room_image_url">Obra em ambiente</option><option value="image_url">Foto principal do artista</option><option value="studio_image_url">Imagem de ateliê</option></select></label><label class="full">Arquivo<input id="upload-imagens-file-5" name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required/></label><label class="full">Texto alternativo<input id="upload-imagens-alt-6" name="alt" placeholder="Descrição curta da imagem"/></label></div><div class="admin-print-actions"><button class="admin-button" type="submit">Enviar imagem</button><button class="admin-button secondary" type="button" data-apply-upload-url>Aplicar ao registro</button><button class="admin-button secondary" type="button" data-copy-upload-url>Copiar URL</button></div><p data-upload-status></p><label class="u-visually-hidden" for="upload-imagens-url-publica-aparecera-aqui-7">URL pública aparecerá aqui</label><input id="upload-imagens-url-publica-aparecera-aqui-7" name="url-publica-aparecera-aqui" data-upload-url readonly placeholder="URL pública aparecerá aqui"/></form><div class="admin-media-preview" data-upload-preview>Prévia da imagem</div></article></section></div></main><div class="admin-toast-zone" data-toast-zone></div><script src="js/media-upload.js?v=20260709-advanced-1"></script></body></html>
