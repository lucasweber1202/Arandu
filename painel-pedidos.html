<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="robots" content="noindex,nofollow,noarchive"/><title>Painel de pedidos — Arandu</title><link rel="stylesheet" href="css/arandu-system.css"/><style>.orders-toolbar{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(150px,1fr));gap:10px}.orders-toolbar input,.orders-toolbar select,.order-form input,.order-form select,.order-form textarea{width:100%;border:1px solid rgba(111,34,27,.25);border-radius:12px;padding:10px;background:#fff}.orders-grid{display:grid;gap:16px}.order-card{border:1px solid rgba(111,34,27,.18);border-radius:18px;padding:18px;background:#fff}.order-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.order-meta small{display:block;opacity:.7}.order-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.order-form textarea{grid-column:1/-1;min-height:78px}.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.order-request{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;word-break:break-all}@media(max-width:900px){.orders-toolbar,.order-meta,.order-form{grid-template-columns:1fr 1fr}}@media(max-width:600px){.orders-toolbar,.order-meta,.order-form{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand-logo" href="painel.html">Arandu Painel</a><nav class="site-nav"><a href="painel-reservas.html">Reservas</a><a href="painel-propostas.html">Propostas</a><a href="painel-pedidos.html" aria-current="page">Pedidos</a><a href="painel-certificados.html">Certificados</a></nav><a class="cta" href="index.html">Ver site</a></div></header><main><section class="section section-dark"><div class="container"><p class="eyebrow">Operação comercial</p><h1 class="title">Pedidos</h1><p class="lead">Acompanhe pagamento, embalagem, envio, certificado e conclusão. Toda alteração exige justificativa e passa pela state machine atômica.</p></div></section><section class="section section-muted"><div class="container"><div class="form-card"><div class="orders-toolbar"><input data-order-search type="search" placeholder="Buscar nº, obra, artista ou rastreio"/><select data-order-status><option value="">Todos os pedidos</option><option value="created">Criados</option><option value="confirmed">Confirmados</option><option value="completed">Concluídos</option><option value="cancelled">Cancelados</option></select><select data-payment-status><option value="">Todo pagamento</option><option value="pending">Pendente</option><option value="awaiting_confirmation">Em confirmação</option><option value="paid">Pago</option><option value="refunded">Reembolsado</option><option value="failed">Falhou</option><option value="cancelled">Cancelado</option></select><select data-fulfillment-status><option value="">Toda logística</option><option value="pending">Pendente</option><option value="packing">Em embalagem</option><option value="shipped">Enviado</option><option value="delivered">Entregue</option><option value="returned">Devolvido</option><option value="cancelled">Cancelado</option></select><button class="button secondary" type="button" data-orders-refresh>Atualizar</button></div><p data-orders-status class="selection-summary">Carregando pedidos…</p></div></div></section><section class="section"><div class="container"><div data-orders-list class="orders-grid"></div></div></section></main><script src="js/site.js"></script><script src="js/painel-pedidos.js"></script></body></html>
