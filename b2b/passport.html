<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Passaporte de produto | Arandu</title><link rel="stylesheet" href="/b2b/style.css"></head><body><header><a href="/b2b/index.html">Arandu <small>Passaporte</small></a></header><main><h1>Passaporte digital</h1><div id="passport" role="status">Carregando…</div><p class="muted">Este passaporte exibe apenas dados autorizados para publicação. Não certifica conformidade jurídica.</p></main><script type="module">const node=document.querySelector('#passport');const token=new URL(location.href).searchParams.get('token');if(!/^[0-9a-f-]{36}$/i.test(token||''))node.textContent='Identificador inválido.';else fetch('/api/b2b/passport/'+encodeURIComponent(token)).then(r=>r.json()).then(data=>{node.replaceChildren();if(!data.ok){node.textContent='Passaporte indisponível.';return}for(const [label,value] of Object.entries(data.passport)){const p=document.createElement('p');p.textContent=label.replaceAll('_',' ')+': '+String(value??'—');node.append(p)}}).catch(()=>node.textContent='Passaporte indisponível.');</script></body></html>
